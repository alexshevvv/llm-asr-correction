[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "llm-asr-correction"
version = "0.2.0"
description = "ASR error correction using Large Language Models"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Aleksey Shevchenko"},
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
